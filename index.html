<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EAE5">
<title>Итоговый тест — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--lime:#BFE74B;--lime-d:#6E9A12;--ink:#0A0605;--blue:#41559A;--red:#D7263D;--green:#1B8A4C;
  --amber:#B7791F;--muted:#5E635B;--line:#D9DCD4;--paper:#FAFBF8;--kick:#7A7E77;--bg:#E9EAE5;
  --card:#fff;--soft:#EEF0EA}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Gilroy','Onest','Inter','Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.45}
[hidden]{display:none!important}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}
header.top img{height:44px;display:block}
.kick,header.top span{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--kick)}
h1{font-size:42px;line-height:1.08;letter-spacing:-.03em;margin:0 0 12px}
h1 em{font-style:normal;color:var(--lime-d)}
h2{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.lead{font-size:19px;color:var(--muted);margin:0 0 22px;max-width:720px}
.small{font-size:15px;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px;
  box-shadow:0 10px 30px rgba(10,6,5,.05)}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:99px;padding:14px 28px;
  cursor:pointer;background:var(--lime);color:var(--ink);transition:transform .1s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:50px}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:var(--soft);color:#2D2D2D}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{font-size:15px;padding:9px 16px;min-height:40px}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.demo{background:#FFF7DB;border:1px solid #F0DC9A;color:#5C4A12;border-radius:14px;padding:12px 16px;
  font-size:15px;margin:-8px 0 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo b{font-weight:800}
.foot{text-align:center;margin:26px 0 0;font-size:15px}
.foot a{color:var(--muted)}

/* ---------- вход участника ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;grid-template-areas:'intro form' 'rules form';gap:0 34px;align-items:start}
.hero .intro{grid-area:intro}.hero .rules{grid-area:rules}.hero .login{grid-area:form}
.facts{list-style:none;padding:0;margin:0 0 24px;display:flex;gap:12px;flex-wrap:wrap}
.facts li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:120px}
.facts b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.facts span{font-size:14px;color:var(--muted)}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;font-size:16px;color:#2D2D2D;align-items:flex-start}
.rules li i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--lime);font-style:normal;
  font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.login h2{margin-bottom:4px}
.fld{display:block;margin:16px 0 0}
.fld>span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input,.fld select,.ctl{width:100%;font:inherit;font-size:18px;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--paper);color:var(--ink);min-height:52px}
.fld input:focus{border-color:var(--blue);outline:none;background:#fff}
.fld input.bad{border-color:var(--red);background:#FDF0F1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.err{color:var(--red);font-size:15px;min-height:22px;margin:10px 0 6px}
.resume{border:1.5px solid var(--lime);background:#F6FBE8}

/* ---------- вопрос ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.who{font-size:15px;color:var(--muted);font-weight:600}
.num{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--kick)}
.bar{height:6px;background:#DADDD4;border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s ease}
.q{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0 0 6px}
.hintline{font-size:16px;color:var(--muted);margin:0 0 16px}
.qfig{position:relative;margin:6px 0 20px}
.qimg{width:100%;border:1px solid var(--line);border-radius:14px;display:block;cursor:zoom-in;background:#fff}
.qfig .zbtn{position:absolute;right:10px;bottom:10px;background:rgba(10,6,5,.78);color:#fff;border:0;
  border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:12px;margin:14px 0 22px}
.opt{display:flex;align-items:flex-start;gap:14px;border:1.5px solid var(--line);width:100%;text-align:left;
  background:var(--paper);border-radius:14px;padding:16px 18px;cursor:pointer;color:var(--ink);
  font:inherit;font-size:19px;line-height:1.35;transition:border-color .15s,background .15s;min-height:58px}
.opts.short{display:grid;grid-template-columns:repeat(4,1fr)}
.opts.short .opt{align-items:center;font-weight:800;font-size:22px}
.opt:hover{border-color:#B9BDB4}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #B9BDB4;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  color:#fff;background:#fff;margin-top:1px}
.opt.sq .mk{border-radius:8px}
.opt.on{border-color:var(--blue);background:#EEF2FB}
.opt.on .mk{background:var(--blue);border-color:var(--blue)}
.opt .ord{flex:none;width:28px;height:28px;border-radius:8px;background:var(--lime);
  color:var(--ink);font-weight:900;font-size:15px;display:none;align-items:center;justify-content:center;margin-top:1px}
.opt.on.ordmode .ord{display:flex}
.opt.on.ordmode .mk{display:none}
.actions,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .grow{flex:1}
.actions .grow{flex:1}
.state{font-size:15px;color:var(--muted)}

/* ---------- результат ---------- */
.score{display:flex;align-items:center;gap:28px;margin-bottom:22px;flex-wrap:wrap}
.ring{--p:0;--c:var(--green);width:150px;height:150px;flex:none;border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#E2E5DD 0);display:grid;place-items:center}
.ring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:38px;font-weight:900;letter-spacing:-.03em;color:var(--c)}
.verdict{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;color:var(--muted);margin-top:10px}
.meta b{color:var(--ink);font-weight:700}
.send{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;
  font-size:15px;margin:0 0 22px;background:var(--soft)}
.send.ok{background:#EFF8F2;color:#145C34}
.send.bad{background:#FDF0F1;color:#8E1525}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 22px}
.dots a{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800;
  color:#fff;text-decoration:none}
.dots a.ok{background:var(--green)} .dots a.no{background:var(--red)}
.rev{border-top:1px solid var(--line);padding-top:18px}
.rev h3{font-size:21px;margin:0 0 8px}
.ritem{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.4;scroll-margin-top:16px}
.ritem>b{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center}
.ritem.ok>b{background:var(--green)} .ritem.no>b{background:var(--red)}
.ritem .rq{font-weight:700;display:block}
.ritem em{display:block;font-style:normal;color:var(--muted);font-size:16px;margin-top:5px}
.ritem em.mine{color:#8E1525} .ritem em.right{color:#145C34}

/* ---------- оверлеи ---------- */
#zoom{position:fixed;inset:0;background:rgba(255,255,255,.98);display:none;z-index:60;overflow:auto;
  -webkit-overflow-scrolling:touch}
#zoom.on{display:block}
#zoom .zi{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 8px 8px}
#zoom img{max-width:97vw;max-height:calc(100vh - 70px);object-fit:contain;cursor:zoom-in;display:block}
#zoom.full .zi{display:block;padding-top:56px}
#zoom.full img{max-width:none;max-height:none;width:auto;cursor:zoom-out}
.ztools{position:fixed;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;z-index:61;pointer-events:none}
.ztools>*{pointer-events:auto}
.ztools span{background:rgba(10,6,5,.75);color:#fff;border-radius:99px;padding:8px 14px;font-size:14px;align-self:center}
#modal{position:fixed;inset:0;background:rgba(10,6,5,.45);display:none;z-index:50;overflow:auto;padding:24px 14px}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:20px;max-width:820px;margin:0 auto;padding:26px 28px;position:relative}
#modal .x{position:absolute;top:14px;right:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);opacity:0;background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;z-index:80;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- панель тренера ---------- */
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.thead h1{font-size:34px;margin:0}
.thead .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#DFE1DA;padding:5px;border-radius:99px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font:inherit;font-size:15px;font-weight:700;border:0;background:transparent;
  border-radius:99px;padding:10px 16px;cursor:pointer;color:#2D2D2D;min-height:44px}
.tabs button.on{background:#fff;box-shadow:0 2px 8px rgba(10,6,5,.08)}
.filters{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.4fr;gap:10px;align-items:end;margin-bottom:10px}
.filters label>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.ctl{font-size:16px;padding:9px 12px;min-height:44px;border-radius:12px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:#2D2D2D;cursor:pointer;margin:4px 0 16px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:14px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{text-align:left;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--kick);
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.nos{cursor:default}
.tbl td{padding:11px 10px;border-bottom:1px solid #EEF0EA;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#F7F8F4}
.tbl .r{text-align:right}
.pbar{display:flex;align-items:center;gap:10px;min-width:150px}
.pbar s{flex:1;height:8px;border-radius:99px;background:#E7E9E2;overflow:hidden;text-decoration:none;display:block}
.pbar s i{display:block;height:100%;border-radius:99px}
.pbar b{min-width:44px;text-align:right}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.ok{background:#E3F4EA;color:#145C34} .tag.no{background:#FBE4E7;color:#8E1525}
.tag.gr{background:var(--soft);color:#2D2D2D}
.cards{display:none}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.rc .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.rc .l2{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:16px}
.qstat{border-top:1px solid var(--line);padding:18px 0}
.qstat:first-child{border-top:0;padding-top:4px}
.qstat .qh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qstat .qt{font-weight:800;font-size:18px;line-height:1.3}
.qstat .qn{color:var(--kick);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
.big{font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.olist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.olist li{display:grid;grid-template-columns:24px 1fr 170px;gap:10px;align-items:center;font-size:16px}
.olist li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;background:#C8CCC2}
.olist li.cor .ic{background:var(--green)}
.olist li.cor .ot{font-weight:700;color:#145C34}
.exp{border-left:5px solid var(--lime);background:var(--paper);border-radius:0 12px 12px 0;padding:12px 16px;font-size:16px;line-height:1.5;color:#2D2D2D;margin-top:12px}
.thumb{width:220px;max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:10px;cursor:zoom-in;display:block}
.qrwrap{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
#qrbox{width:280px;height:280px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;place-items:center}
#qrbox img,#qrbox canvas{width:100%!important;height:auto!important}
.linkline{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;word-break:break-all;margin:10px 0}
#qrbig{position:fixed;inset:0;background:#fff;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#qrbig.on{display:flex}
#qrbig .qrc{width:min(70vh,86vw);height:min(70vh,86vw)}
#qrbig .qrc img,#qrbig .qrc canvas{width:100%!important;height:auto!important}
#qrbig h2{font-size:clamp(22px,4vw,44px);margin:0}
#qrbig p{margin:0;color:var(--muted);font-size:clamp(14px,1.8vw,22px);word-break:break-all}
.gtbl td:first-child{font-weight:700}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;grid-template-areas:'intro' 'form' 'rules';gap:0}
  .hero .login{margin-bottom:22px}
  .facts{margin-bottom:18px}
  .filters{grid-template-columns:1fr 1fr}
  .filters .fsearch{grid-column:1/-1}
  .kpis{grid-template-columns:1fr 1fr}
  .qrwrap{grid-template-columns:1fr}
}
@media (max-width:720px){
  html,body{font-size:17px}
  .wrap{padding:14px 14px 40px}
  header.top{margin-bottom:18px;padding-bottom:12px}
  header.top img{height:34px}
  header.top span{font-size:11px;letter-spacing:.1em;text-align:right;max-width:52%}
  .card{padding:20px 16px;border-radius:18px}
  h1{font-size:30px}
  .lead{font-size:17px}
  .facts li{min-width:0;flex:1;padding:10px 12px}
  .facts b{font-size:22px}
  .grid2{grid-template-columns:1fr}
  .q{font-size:22px}
  .opt{font-size:17px;padding:14px 14px;gap:12px}
  .opts.short{grid-template-columns:1fr 1fr;gap:10px}
  .demo{font-size:14px;padding:10px 12px;margin:-4px 0 16px}
  .actions{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 18px);
    margin:0 -16px -20px;padding:22px 16px calc(14px + env(safe-area-inset-bottom));border-radius:0 0 18px 18px}
  .actions .btn{flex:1;padding:14px 16px}
  .actions .state{flex-basis:100%;order:-1;text-align:center}
  .actions .grow{display:none}
  .ring{width:120px;height:120px}.ring>div{width:94px;height:94px;font-size:30px}
  .verdict{font-size:24px}
  .ritem{font-size:16px;gap:10px}
  .thead h1{font-size:26px}
  .tabs .lg{display:none}
  .tabs button{padding:10px 10px;font-size:14px}
  .tbl.desk{display:none}
  .cards{display:block}
  .olist li{grid-template-columns:22px 1fr;row-gap:2px}
  .olist li .pbar{grid-column:2;min-width:0}
  #modal .box{padding:22px 16px}
  .kpi b{font-size:24px}
  .panel{padding:14px 14px}
}
</style></head>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const CONFIG = {
  // Адрес веб-приложения Google Apps Script (см. ИНСТРУКЦИЯ.md).
  // Пока пусто — тест работает в демо-режиме: результаты хранятся только в этом браузере.
  API_URL: 'https://script.google.com/macros/s/AKfycbxckKIQZr11lHgEvjKf3xImZSsOUjSytViYQEu4Vpw2Azg-o3Lx-Ruckd9yEOsKc_GvzQ/exec',
  TITLE: 'Визуализация данных и информационные панели <em>Dashboard</em>',

/* ======================= ВОПРОСЫ =======================
   t: "one" — один ответ, "many" — несколько, "order" — последовательность
   o: варианты, a: правильный ответ (индекс с нуля / массив индексов), e: пояснение,

const Q = [
  {"t": "one", "q": "Что из перечисленного удаляют с диаграммы, если включены метки данных?", "o": ["Заголовок диаграммы", "Легенду", "Шкалу и линии сетки", "Подписи категорий"], "a": 2, "e": "Числа уже подписаны на самих рядах. Шкала и сетка показывают их второй раз и только добавляют шум."},
  {"t": "one", "q": "Для чего используется комбинированная диаграмма?", "o": ["Распределение по сегментам", "Долевое распределение в динамике", "Сравнение показателей разного порядка", "Отображение вложенной структуры"], "a": 2, "e": "Столбцы и линия на одной диаграмме позволяют свести величины разного масштаба — например, выручку в миллионах и выполнение плана в процентах."},
  {"t": "one", "q": "Какой приём не относится к плоскому дизайну?", "o": ["Контуры реальных объектов без лишних деталей", "Чистые яркие цвета", "Градиенты, тени и блики", "Крупная типографика и воздух"], "a": 2, "e": "Плоский дизайн отказался от объёма: теней, бликов и градиентов. Предмет узнаётся по силуэту, цвет берут чистый, а работают размер шрифта и пустое место."},
  {"t": "one", "q": "Какой отчёт не является стратегическим?", "img": "q4", "o": ["А", "Б", "В", "Г"], "a": 3, "e": "Г — аналитический отчёт: разрезы, фильтры и детализация до отдельных заёмщиков. Стратегический показывает агрегированные показатели компании за квартал и год."},
  {"t": "one", "q": "Какой принцип прочтения информации в отчётности считается оптимальным?", "o": ["Слева направо, сверху вниз", "Справа налево, сверху вниз", "Из центра к краям", "Не имеет значения"], "a": 0, "e": "Взгляд идёт по Z-паттерну: от левого верхнего угла вправо и вниз. Поэтому главное ставят сверху слева."},
  {"t": "one", "q": "В каком отчёте нарушен принцип уровней информации?", "img": "q6", "o": ["А", "Б", "В", "Г"], "a": 1, "e": "Б — все плитки одного веса и разной величины. Нет сводки, нет главного: взгляду не за что зацепиться."},
  {"t": "one", "q": "Для чего НЕ используется надстройка Power Pivot?", "o": ["Настройка модели данных", "Обработка исходных данных", "Создание новых мер", "Создание новых столбцов", "Создание таблицы дат"], "a": 1, "e": "Исходные данные готовят в Power Query: чистят, объединяют, фильтруют. Power Pivot работает уже с готовой моделью."},
  {"t": "order", "q": "Установите правильную последовательность шагов по созданию таблицы справочника в надстройке Power Query", "o": ["Создать дубликат исходной таблицы с категориями", "Добавить все таблицы, где встречаются заданные категории", "Удалить все столбцы, кроме категории для справочника", "Отфильтровать непустые категории", "Удалить дубликаты"], "a": [0, 1, 2, 3, 4], "e": "Сначала дубликат исходной таблицы, затем сбор всех таблиц с этой категорией. Потом убираем лишние столбцы, отфильтровываем пустые значения и только в конце удаляем дубликаты — иначе пустая строка останется в справочнике."},
  {"t": "many", "q": "Где в отчёте следует располагать срезы?", "o": ["Слева", "Справа", "Сверху", "Снизу", "В центре", "В любом месте"], "a": [0, 2], "e": "Срезы ставят слева узкой колонкой или сверху полосой — там, где взгляд начинает читать отчёт. Справа и снизу их просто не заметят."},
  {"t": "one", "q": "Какой вид условного форматирования наилучшим образом показывает сравнение абсолютных показателей?", "o": ["Гистограмма", "Цветовая шкала", "Значки", "Цвет шрифта"], "a": 0, "e": "Полосы в ячейках дают длину, пропорциональную величине: значения сравниваются глазом. Цветовая шкала и значки показывают оценку, а не размер."}
];
</script>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO = !CONFIG.API_URL;
const K = {state:'ibaFT.state.v1', outbox:'ibaFT.outbox.v1', demo:'ibaFT.demoDB.v1', trainer:'ibaFT.trainer.v1'};
const mkStore = area => ({
  get(k, d){ try { const v = area().getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { area().setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { area().removeItem(k); } catch(e){} }
});
const ls = mkStore(() => localStorage), ss = mkStore(() => sessionStorage);

const uid = () => { try { return crypto.randomUUID(); } catch(e){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } };
const normName = s => String(s).replace(/\s+/g, ' ').trim().toLowerCase()
  .replace(/(^|[\s-])(\S)/g, (m, a, b) => a + b.toUpperCase());
const normGroup = s => String(s).replace(/\s+/g, ' ').trim()
  .replace(/^(группа|гр\.?)\s*/i, '').replace(/^№\s*/, '').toUpperCase();
const personKey = r => [r.surname, r.name, r.group].map(s => String(s).toLowerCase().replace(/ё/g, 'е')).join('|');
const pad = n => String(n).padStart(2, '0');
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '—' :
  `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDur = sec => { sec = Math.max(0, Math.round(+sec || 0)); const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m} мин ${pad(s)} с` : `${s} с`; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const pctColor = p => p >= CONFIG.PASS_PCT ? 'var(--green)' : p >= 50 ? 'var(--amber)' : 'var(--red)';
const pbar = (p, extra = '') => `<span class="pbar"><s><i style="width:${p}%;background:${pctColor(p)}"></i></s><b>${p}%</b>${extra}</span>`;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
const setKicker = t => $('#kicker').textContent = t;
const top0 = () => window.scrollTo({top: 0, behavior: 'smooth'});

/* ---------- оценка ---------- */
function isCorrect(q, a){
  if (q.t === 'one') return a === q.a;
  if (!Array.isArray(a) || a.length !== q.a.length) return false;
  if (q.t === 'many') return q.a.every(v => a.includes(v));
  return a.every((v, n) => v === q.a[n]);
}
function answerText(q, a){
  if (a === null || a === undefined) return '—';
  if (q.t === 'one') return q.o[a] ?? '—';
  if (q.t === 'many') return a.map(v => q.o[v]).join(', ') || '—';
  return a.map((v, p) => `${p + 1}. ${q.o[v]}`).join('; ') || '—';
}
function grade(answers){
  const ok = Q.map((q, k) => isCorrect(q, answers[k]));
  const score = ok.filter(Boolean).length, pct = Math.round(score / Q.length * 100);
  return {ok, score, total: Q.length, pct, passed: pct >= CONFIG.PASS_PCT};
}

/* ---------- хранилище: Google Таблица или демо ---------- */
async function api(payload){
  if (DEMO) return demoApi(payload);
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(CONFIG.API_URL, {method: 'POST', body: JSON.stringify(payload), signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function demoApi(p){
  const db = ls.get(K.demo, []);
  if (p.action === 'check'){
    const prev = db.find(x => personKey(x) === personKey(p));
    return {ok: true, taken: !!prev, finishedAt: prev ? prev.finishedAt : null};
  }
  if (p.action === 'submit'){
    let rec = db.find(x => x.id === p.record.id);
    if (!rec){
      const prev = db.filter(x => personKey(x) === personKey(p.record));
      if (!CONFIG.ALLOW_RETAKE && prev.length) return {ok: false, error: 'already_taken', finishedAt: prev[0].finishedAt};
      rec = {...p.record, attempt: prev.length + 1}; db.push(rec); ls.set(K.demo, db);
    }
    return {ok: true, attempt: rec.attempt};
  }
  if (p.action === 'results'){
    if (p.password !== CONFIG.DEMO_TRAINER_PASSWORD) return {ok: false, error: 'auth'};
    return {ok: true, rows: db};
  }
  return {ok: false, error: 'unknown_action'};
}

/* ---------- отправка результатов с повтором ---------- */
let flushing = false, retryTimer = null;
function outboxAdd(rec){ const box = ls.get(K.outbox, []); if (!box.some(r => r.id === rec.id)) box.push(rec); ls.set(K.outbox, box); }
async function flushOutbox(){
  if (flushing) return; flushing = true;
  let failed = false;
  try {
    for (const rec of ls.get(K.outbox, [])){
      try {
        const r = await api({action: 'submit', record: rec});
        if (r && r.error === 'already_taken'){   // повторная попытка — сервер её не принял
          ls.set(K.outbox, ls.get(K.outbox, []).filter(x => x.id !== rec.id));
          if (S && S.result && S.result.rec.id === rec.id){ S.result.rejected = r.finishedAt || true; save(); }
          continue;
        }
        if (!r || !r.ok) throw new Error(r && r.error || 'error');
        ls.set(K.outbox, ls.get(K.outbox, []).filter(x => x.id !== rec.id));
        if (S && S.result && S.result.rec.id === rec.id){ S.result.sent = true; S.result.attempt = r.attempt; save(); }
      } catch(e){ failed = true; break; }
    }
  } finally { flushing = false; }
  sendFailed = failed;
  updateSendStatus();
  clearTimeout(retryTimer);
  if (failed) retryTimer = setTimeout(flushOutbox, 15000);
}
let sendFailed = false;
window.addEventListener('online', flushOutbox);

/* ======================= УЧАСТНИК ======================= */
let S = ls.get(K.state, null);
const save = () => ls.set(K.state, S);

function showLogin(prefGroup = ''){
  setKicker('Итоговое тестирование');
  $('#app').innerHTML = `
  <div class="hero">
    <section class="intro">
      <h1>${CONFIG.TITLE}</h1>
      <p class="lead">Итоговый тест по материалам курса. Ответьте на ${Q.length} ${plural(Q.length,'вопрос','вопроса','вопросов')} —
        в конце сразу увидите результат и разбор каждого ответа.</p>
      <ul class="facts">
        <li><b>${Q.length}</b><span>${plural(Q.length,'вопрос','вопроса','вопросов')}</span></li>
        <li><b>~${CONFIG.MINUTES}</b><span>минут</span></li>
        <li><b>${CONFIG.PASS_PCT}%</b><span>проходной балл</span></li>
      </ul>
    </section>
      <ul class="rules">
        <li><i>1</i><span>Введите фамилию, имя и номер группы — так тренер увидит ваш результат.</span></li>
        <li><i>2</i><span>Ответ можно изменить: кнопка «Назад» вернёт к предыдущему вопросу.</span></li>
        <li><i>3</i><span>Картинки в вопросах открываются на весь экран — нажмите на них.</span></li>
        <li><i>4</i><span>Если страница случайно закроется, прогресс сохранится на этом устройстве.</span></li>
      </ul>
    <form class="card login" id="f" novalidate>
      <h2>Представьтесь</h2>
      <p class="small">Данные увидит только тренер.${CONFIG.ALLOW_RETAKE ? '' : ' Пройти тест можно <b>один раз</b>.'}</p>
      <label class="fld"><span>Фамилия</span><input name="surname" autocomplete="family-name" autocapitalize="words" enterkeyhint="next" required></label>
      <label class="fld"><span>Имя</span><input name="name" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" required></label>
      <label class="fld"><span>Номер группы</span><input name="group" autocomplete="off" enterkeyhint="go" required value="${esc(prefGroup)}"></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn wide">Начать тест →</button>
    </form>
  </div>
  <p class="foot"><a href="?trainer" id="toTrainer">Вход для тренера</a></p>`;
  const f = $('#f');
  f.onsubmit = async e => {
    e.preventDefault();
    const v = {surname: normName(f.surname.value), name: normName(f.name.value), group: normGroup(f.group.value)};
    let bad = null;
    for (const k of ['surname', 'name', 'group']){
      const short = k === 'group' ? !v[k] : v[k].length < 2;
      f[k].classList.toggle('bad', short); if (short && !bad) bad = k;
    }
    if (bad){ $('#err').textContent = 'Заполните все поля: фамилию, имя и номер группы.'; f[bad].focus(); return; }
    if (CONFIG.ALLOW_RETAKE) return startTest(v);
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Проверяем…';
    // проверяем, не проходил ли участник тест раньше; без связи — пускаем, сервер проверит при отправке
    const r = await Promise.race([api({action: 'check', ...v}).catch(() => null), new Promise(res => setTimeout(res, 8000))]);
    if (r && r.ok && r.taken) return showTaken(v, r.finishedAt);
    startTest(v);
  };
  $('#toTrainer').onclick = e => { e.preventDefault(); showTrainerLogin(); };
}

function showTaken(user, when){
  setKicker('Итоговое тестирование');
  $('#app').innerHTML = `
    <div class="card" style="max-width:640px;margin:0 auto">
      <h2>Тест уже пройден</h2>
      <p class="lead" style="margin:10px 0 18px"><b>${esc(user.surname)} ${esc(user.name)}</b>, группа ${esc(user.group)},
        уже проходил(а) этот тест${when ? ' ' + fmtDate(when) : ''}. Пройти его можно только один раз.</p>
      <p class="small">Если это ошибка или вы однофамилец из той же группы — обратитесь к тренеру.</p>
      <div class="row" style="margin-top:22px"><button type="button" class="btn ghost" id="back">← Назад</button></div>
    </div>`;
  $('#back').onclick = () => { showLogin(user.group); top0(); };
}

function startTest(user){
  S = {user, startedAt: new Date().toISOString(), i: 0, answers: Array(Q.length).fill(null), result: null};
  save(); showQuestion(); top0();
}

function optsHtml(){
  const q = Q[S.i], sel = S.answers[S.i], many = q.t === 'many', order = q.t === 'order';
  return q.o.map((t, k) => {
    let on = false, pos = '';
    if (order && Array.isArray(sel)){ const p = sel.indexOf(k); if (p >= 0){ on = true; pos = p + 1; } }
    else if (many && Array.isArray(sel)) on = sel.includes(k);
    else if (!many && !order) on = sel === k;
    const cls = 'opt' + (many ? ' sq' : '') + (order ? ' ordmode' : '') + (on ? ' on' : '');
    const role = many ? 'role="checkbox"' : order ? '' : 'role="radio"';
    return `<button type="button" class="${cls}" data-k="${k}" ${role} aria-${order ? 'pressed' : 'checked'}="${on}">
      <span class="mk">${on ? '✓' : ''}</span><span class="ord">${pos}</span><span>${t}</span></button>`;
  }).join('');
}
function showQuestion(){
  setKicker('Итоговое тестирование');
  const i = S.i, q = Q[i], last = i === Q.length - 1;
  const hint = q.t === 'many' ? 'Выберите все подходящие варианты'
            : q.t === 'order' ? 'Нажимайте на пункты в правильном порядке — рядом появится номер' : 'Выберите один вариант';
  $('#app').innerHTML = `
    <div class="qtop"><span class="who">${esc(S.user.surname)} ${esc(S.user.name)} · группа ${esc(S.user.group)}</span>
      <span class="num">Вопрос ${i + 1} из ${Q.length}</span></div>
    <div class="bar"><i style="width:${i / Q.length * 100}%"></i></div>
    <div class="card">
      <p class="q">${q.q}</p>
      <p class="hintline">${hint}</p>
      ${q.img ? `<div class="qfig"><img class="qimg" src="${IMG[q.img]}" alt="Варианты ответа к вопросу ${i + 1}">
        <button type="button" class="zbtn">⤢ Увеличить</button></div>` : ''}
      <div class="opts${q.o.every(t => t.length <= 2) ? ' short' : ''}" ${q.t === 'one' ? 'role="radiogroup"' : ''}>${optsHtml()}</div>
      <div class="actions">
        ${i > 0 ? '<button type="button" class="btn ghost" id="back">← Назад</button>' : ''}
        ${q.t === 'order' ? '<button type="button" class="btn ghost" id="reset">Сбросить</button>' : ''}
        <span class="state" id="state"></span><span class="grow"></span>
        <button type="button" class="btn" id="next">${last ? 'Завершить тест' : 'Дальше →'}</button>
      </div>
    </div>`;
  bindOpts();
  $('#next').onclick = next;
  if ($('#back')) $('#back').onclick = () => { S.i--; save(); showQuestion(); };
  if ($('#reset')) $('#reset').onclick = () => { S.answers[S.i] = []; save(); refreshOpts(); };
  if (q.img) $$('.qimg, .zbtn').forEach(el => el.onclick = () => openZoom(IMG[q.img]));
  updateState();
}
function bindOpts(){ $$('.opt').forEach(el => el.onclick = () => pick(+el.dataset.k)); }
function refreshOpts(){ $('.opts').innerHTML = optsHtml(); bindOpts(); updateState(); }
function pick(k){
  const q = Q[S.i];
  if (q.t === 'one') S.answers[S.i] = k;
  else {
    const a = Array.isArray(S.answers[S.i]) ? S.answers[S.i].slice() : [];
    const p = a.indexOf(k); p >= 0 ? a.splice(p, 1) : a.push(k);
    S.answers[S.i] = a;
  }
  save(); refreshOpts();
}
function ready(){
  const q = Q[S.i], a = S.answers[S.i];
  if (q.t === 'one') return a !== null;
  if (q.t === 'many') return Array.isArray(a) && a.length > 0;
  return Array.isArray(a) && a.length === q.o.length;
}
function updateState(){
  const q = Q[S.i], a = S.answers[S.i];
  $('#next').disabled = !ready();
  $('#state').textContent = q.t === 'order' && !ready()
    ? `отмечено ${Array.isArray(a) ? a.length : 0} из ${q.o.length}` : '';
}
function next(){
  if (!ready()) return;
  if (S.i === Q.length - 1) return finish();
  S.i++; save(); showQuestion(); top0();
}

function finish(){
  const g = grade(S.answers), fin = new Date();
  const rec = {id: uid(), surname: S.user.surname, name: S.user.name, group: S.user.group,
    startedAt: S.startedAt, finishedAt: fin.toISOString(),
    durationSec: Math.round((fin - new Date(S.startedAt)) / 1000),
    answers: S.answers, score: g.score, total: g.total, pct: g.pct, passed: g.passed};
  S.result = {rec, sent: false, attempt: null};
  save(); outboxAdd(rec);
  sendFailed = false;
  showResult(); top0();
  flushOutbox();
}

function verdict(g){
  if (g.pct === 100) return 'Безупречно! Все ответы верные';
  if (g.passed) return g.pct >= 90 ? 'Отличный результат!' : 'Тест пройден';
  return 'Тест не пройден';
}
function showResult(){
  setKicker('Ваш результат');
  const rec = S.result.rec, g = grade(rec.answers);
  const need = Math.ceil(CONFIG.PASS_PCT / 100 * Q.length) - g.score;
  const rows = Q.map((q, k) => {
    const good = g.ok[k];
    const det = CONFIG.SHOW_ANSWERS
      ? `${good ? '' : `<em class="mine">Ваш ответ: ${answerText(q, rec.answers[k])}</em><em class="right">Правильно: ${answerText(q, q.a)}</em>`}<em>${q.e}</em>`
      : '';
    return `<div class="ritem ${good ? 'ok' : 'no'}" id="r${k}"><b>${good ? '✓' : k + 1}</b>
      <span><span class="rq">${k + 1}. ${q.q}</span>${det}</span></div>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="card">
      <div class="score">
        <div class="ring" style="--p:${g.pct};--c:${g.passed ? 'var(--green)' : 'var(--red)'}"><div>${g.pct}%</div></div>
        <div>
          <p class="verdict">${verdict(g)}</p>
          <p class="small">Правильных ответов: <b>${g.score} из ${Q.length}</b>. Проходной балл — ${CONFIG.PASS_PCT}%.
            ${!g.passed && need > 0 ? `Не хватило ${need} ${plural(need,'верного ответа','верных ответов','верных ответов')}.` : ''}</p>
          <div class="meta"><span><b>${esc(rec.surname)} ${esc(rec.name)}</b></span><span>Группа <b>${esc(rec.group)}</b></span>
            <span>${fmtDate(rec.finishedAt)}</span><span>Время: ${fmtDur(rec.durationSec)}</span>
            <span id="att"></span></div>
        </div>
      </div>
      <div class="send" id="send"></div>
      <div class="dots">${g.ok.map((v, k) => `<a href="#r${k}" class="${v ? 'ok' : 'no'}" title="Вопрос ${k + 1}">${k + 1}</a>`).join('')}</div>
      <div class="rev"><h3>Разбор ответов</h3>${rows}</div>
      <div class="row" style="margin-top:22px">
        ${CONFIG.ALLOW_RETAKE ? '<button type="button" class="btn" id="again">Пройти ещё раз</button>' : ''}
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="exit">Завершить сеанс</button>
      </div>
    </div>`;
  $$('.dots a').forEach(a => a.onclick = e => { e.preventDefault(); $(a.getAttribute('href')).scrollIntoView({behavior: 'smooth'}); });
  if ($('#again')) $('#again').onclick = () => startTest(S.user);
  $('#exit').onclick = () => {
    if (!S.result.sent && !S.result.rejected && !confirm('Результат ещё не отправлен тренеру. Всё равно выйти? Отправка продолжится, когда вы снова откроете тест на этом устройстве.')) return;
    S = null; ls.del(K.state); showLogin(); top0();
  };
  updateSendStatus();
}
function updateSendStatus(){
  const el = $('#send'); if (!el || !S || !S.result) return;
  const r = S.result;
  if (r.rejected){
    el.className = 'send bad';
    el.innerHTML = `Этот результат не засчитан: тест уже был пройден под этим именем${r.rejected !== true ? ' ' + fmtDate(r.rejected) : ''}. Засчитывается только первая попытка. Если это ошибка — обратитесь к тренеру.`;
  } else if (r.sent){
    el.className = 'send ok';
    el.innerHTML = DEMO ? '✓ Сохранено в демо-режиме (только в этом браузере)' : '✓ Результат сохранён — тренер его видит';
    if (r.attempt > 1) $('#att').innerHTML = `Попытка <b>${r.attempt}</b>`;
  } else if (sendFailed){
    el.className = 'send bad';
    el.innerHTML = 'Не удалось отправить результат — проверьте интернет. Пробуем снова автоматически. <button class="btn sm dark" id="retry">Повторить сейчас</button>';
    $('#retry').onclick = () => { el.className = 'send'; el.textContent = 'Отправляем результат тренеру…'; flushOutbox(); };
  } else { el.className = 'send'; el.textContent = 'Отправляем результат тренеру…'; }
}

async function loadResults(){
  try {

    if (!r.ok) return r.error === 'auth' ? 'Неверный пароль.' : 'Ошибка сервера: ' + (r.error || 'неизвестно');
    T.rows = (r.rows || []).map(x => ({...x,
      answers: typeof x.answers === 'string' ? JSON.parse(x.answers || '[]') : (x.answers || []),
      score: +x.score, total: +x.total || Q.length, pct: +x.pct, attempt: +x.attempt || 1, durationSec: +x.durationSec || 0,
      passed: +x.pct >= CONFIG.PASS_PCT}));   // статус считаем по текущему порогу, в т.ч. для старых записей
    return true;
  } catch(e){ return 'Не удалось загрузить результаты. Проверьте интернет и адрес API.'; }

function filtered(){
  const f = T.f, q = f.q.trim().toLowerCase();
  let rows = T.rows.filter(r =>
    (!f.group || r.group === f.group) &&
    (!f.status || (f.status === 'ok') === !!r.passed) &&
    (!f.from || dayKey(r.finishedAt) >= f.from) && (!f.to || dayKey(r.finishedAt) <= f.to) &&
    (!q || `${r.surname} ${r.name}`.toLowerCase().includes(q)));
  if (f.last){
    const best = new Map();
    for (const r of rows){ const k = personKey(r), b = best.get(k);
      if (!b || new Date(r.finishedAt) > new Date(b.finishedAt)) best.set(k, r); }
    rows = [...best.values()];
  }
  return rows;
}

  rows.sort((a, b) => { const x = val(a), y = val(b);

    <div class="panel">
      <h3><span>Участники</span><button class="btn sm" id="xlsx" ${n ? '' : 'disabled'}>⬇ Скачать Excel</button></h3>

      <tbody>${rows.map(r => `<tr data-id="${esc(r.id)}"><td>${fmtDate(r.finishedAt)}</td><td><b>${esc(r.surname)} ${esc(r.name)}</b></td>
        <td>${esc(r.group)}</td><td>${pbar(r.pct)}</td><td><span class="tag ${r.passed ? 'ok' : 'no'}">${r.passed ? 'Сдал(а)' : 'Не сдал(а)'}</span></td>

const loadScript = (src, test) => test() ? Promise.resolve() : new Promise((res, rej) => {
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(); };
  document.head.appendChild(s); });
const xlDate = iso => { const d = new Date(iso);
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 864e5 + 25569; };
async function exportXlsx(rows){
  const btn = $('#xlsx'); btn.disabled = true; btn.textContent = 'Готовим файл…';
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => window.XLSX);
  } catch(e){
    btn.disabled = false; btn.textContent = '⬇ Скачать Excel';
    toast('Не удалось загрузить модуль Excel — скачан CSV'); return exportCsv(rows);
  }
  const typ = {one: 'один ответ', many: 'несколько ответов', order: 'последовательность'};
  const sheet = (aoa, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = widths.map(w => ({wch: w}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: aoa.length - 1, c: aoa[0].length - 1}})};
    return ws; };

  // Участники
  const people = [['Дата', 'Фамилия', 'Имя', 'Группа', 'Баллы', 'Из', '%', 'Статус', 'Попытка', 'Длительность, мин',
    ...Q.map((_, k) => 'В' + (k + 1))]];
  for (const r of rows){ const g = grade(r.answers);
    people.push([{t: 'n', v: xlDate(r.finishedAt), z: 'dd.mm.yyyy hh:mm'}, r.surname, r.name,
      /^\d+$/.test(r.group) ? +r.group : r.group, r.score, r.total, r.pct, r.passed ? 'Сдал' : 'Не сдал', r.attempt,
      {t: 'n', v: Math.round(r.durationSec / 6) / 10, z: '0.0'}, ...g.ok.map(v => v ? 1 : 0)]); }

  // Группы
  const byG = new Map();
  for (const r of rows){ if (!byG.has(r.group)) byG.set(r.group, []); byG.get(r.group).push(r); }
  const groups = [['Группа', 'Участников', 'Средний %', 'Сдали', 'Доля сдавших, %']];
  [...byG.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ru', {numeric: true})).forEach(([g, rs]) => {
    const p = rs.filter(r => r.passed).length;
    groups.push([/^\d+$/.test(g) ? +g : g, rs.length, Math.round(rs.reduce((s, r) => s + r.pct, 0) / rs.length), p,
      Math.round(p / rs.length * 100)]); });

  // Вопросы
  const qs = [['№', 'Вопрос', 'Тип', 'Ответили верно', 'Всего ответов', '% верных', 'Правильный ответ']];
  Q.forEach((q, k) => { const ok = rows.filter(r => isCorrect(q, r.answers[k])).length;
    qs.push([k + 1, q.q, typ[q.t], ok, rows.length, rows.length ? Math.round(ok / rows.length * 100) : 0, answerText(q, q.a)]); });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(people, [17, 18, 14, 9, 8, 6, 6, 10, 9, 12, ...Q.map(() => 5)]), 'Участники');
  XLSX.utils.book_append_sheet(wb, sheet(groups, [10, 12, 11, 8, 16]), 'Группы');
  XLSX.utils.book_append_sheet(wb, sheet(qs, [5, 70, 20, 15, 14, 10, 60]), 'Вопросы');
  XLSX.writeFile(wb, `Итоговый_тест_${T.f.group ? 'группа_' + T.f.group + '_' : ''}${dayKey(new Date())}.xlsx`);
  btn.disabled = false; btn.textContent = '⬇ Скачать Excel';
}
function exportCsv(rows){
  const head = ['Дата', 'Время', 'Фамилия', 'Имя', 'Группа', 'Баллы', 'Из', '%', 'Статус', 'Попытка', 'Длительность, мин',
    ...Q.map((_, k) => 'В' + (k + 1))];
  const cell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = rows.map(r => { const g = grade(r.answers), d = fmtDate(r.finishedAt).split(', ');
    return [d[0], d[1], r.surname, r.name, r.group, r.score, r.total, r.pct, r.passed ? 'Сдал' : 'Не сдал', r.attempt,
      (r.durationSec / 60).toFixed(1).replace('.', ','), ...g.ok.map(v => v ? 1 : 0)].map(cell).join(';'); });
  const blob = new Blob(['﻿' + [head.join(';'), ...lines].join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Итоговый_тест_${T.f.group ? 'группа_' + T.f.group + '_' : ''}${dayKey(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* --- вкладка «Вопросы и статистика» --- */
function tabQuestions(){
  const rows = filtered(), n = rows.length;
  const stats = Q.map((q, k) => {
    const ok = rows.filter(r => isCorrect(q, r.answers[k])).length;
    const pick = q.o.map((_, j) => rows.filter(r => { const a = r.answers[k];
      return q.t === 'one' ? a === j : Array.isArray(a) && (q.t === 'many' ? a.includes(j) : a[j] === q.a[j]); }).length);
    return {k, ok, pct: n ? Math.round(ok / n * 100) : null, pick};
  });
  const order = T.qsort === 'hard' && n ? stats.slice().sort((a, b) => a.pct - b.pct) : stats;
  const typ = {one: 'один ответ', many: 'несколько ответов', order: 'последовательность'};
  $('#tab').innerHTML = `
    <div class="panel">
      <h3><span>${n ? `Ответы ${n} ${plural(n,'участника','участников','участников')}` : 'Вопросы теста'}</span>
        ${n ? `<span class="acts" style="display:flex;gap:6px"><button class="btn sm ${T.qsort === 'num' ? '' : 'ghost'}" data-qs="num">По порядку</button>
        <button class="btn sm ${T.qsort === 'hard' ? '' : 'ghost'}" data-qs="hard">Сначала сложные</button></span>` : ''}</h3>
      ${order.map(st => { const q = Q[st.k];
        const ol = q.t === 'order'
          ? q.a.map((j, p) => `<li class="cor"><span class="ic">${p + 1}</span><span class="ot">${q.o[j]}</span>
              ${n ? pbar(Math.round(st.pick[p] / n * 100)) : ''}</li>`).join('')
          : q.o.map((t, j) => { const c = q.t === 'one' ? q.a === j : q.a.includes(j);
              return `<li class="${c ? 'cor' : ''}"><span class="ic">${c ? '✓' : ''}</span><span class="ot">${t}</span>
              ${n ? `<span class="pbar"><s><i style="width:${Math.round(st.pick[j] / n * 100)}%;background:${c ? 'var(--green)' : '#B9BDB4'}"></i></s><b>${st.pick[j]}</b></span>` : ''}</li>`; }).join('');
        return `<div class="qstat">
          <div class="qh"><div><span class="qn">Вопрос ${st.k + 1} · ${typ[q.t]}</span><span class="qt">${q.q}</span></div>
            ${n ? `<div style="text-align:right"><div class="big" style="color:${pctColor(st.pct)}">${st.pct}%</div><div class="small">ответили верно</div></div>` : ''}</div>
          ${q.img ? `<img class="thumb" src="${IMG[q.img]}" data-img="${q.img}" alt="Картинка к вопросу ${st.k + 1}">` : ''}
          <ul class="olist">${ol}</ul>
          ${q.t === 'order' && n ? '<p class="small" style="margin-top:6px">Полоски — доля участников, поставивших шаг на своё место.</p>' : ''}
          <div class="exp">${q.e}</div></div>`; }).join('')}
    </div>`;
  $$('#tab [data-qs]').forEach(b => b.onclick = () => { T.qsort = b.dataset.qs; tabQuestions(); });
  $$('#tab img[data-img]').forEach(im => im.onclick = () => openZoom(IMG[im.dataset.img]));
}

/* --- вкладка «Ссылка и QR» --- */
const baseUrl = () => location.href.split(/[?#]/)[0];
const shareUrl = g => baseUrl() + (g ? '?group=' + encodeURIComponent(g) : '');
let qrLib = null;
function loadQr(){
  if (window.QRCode) return Promise.resolve();
  if (!qrLib) qrLib = new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = res;
    s.onerror = () => { qrLib = null; rej(); }; document.head.appendChild(s); });
  return qrLib;
}
async function drawQr(el, text, size){
  el.innerHTML = '<span class="small">Создаём QR-код…</span>';
  try { await loadQr(); el.innerHTML = '';
    new QRCode(el, {text, width: size, height: size, colorDark: '#0A0605', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
  } catch(e){ el.innerHTML = '<span class="small">Нет интернета — QR-код не создать. Ссылку можно скопировать.</span>'; }
}
function tabShare(){
  const local = location.protocol === 'file:';
  $('#tab').innerHTML = `
    <div class="panel qrwrap">
      <div>
        <h3>Ссылка для участников</h3>
        ${local ? `<div class="demo" style="margin:0 0 12px">Файл открыт с компьютера. После публикации теста здесь будет его настоящая ссылка — тогда и QR-код заработает на телефонах.</div>` : ''}
        <p class="small">Укажите номер группы — он подставится в форму автоматически. Можно оставить пустым.</p>
        <label class="fld"><span>Группа (необязательно)</span><input id="sg" class="ctl" value="${esc(T.f.group)}" placeholder="Например, 12"></label>
        <div class="linkline" id="sl"></div>
        <div class="row">
          <button class="btn" id="scopy">Скопировать ссылку</button>
          <button class="btn dark" id="sbig">Показать QR на весь экран</button></div>
      </div>
      <div id="qrbox"></div>
    </div>`;
  const upd = () => { const g = normGroup($('#sg').value), u = shareUrl(g); $('#sl').textContent = u; drawQr($('#qrbox'), u, 256); };
  let t; $('#sg').oninput = () => { clearTimeout(t); t = setTimeout(upd, 300); };
  $('#scopy').onclick = async () => { const u = $('#sl').textContent;
    try { await navigator.clipboard.writeText(u); toast('Ссылка скопирована'); }
    catch(e){ prompt('Скопируйте ссылку:', u); } };
  $('#sbig').onclick = () => { const g = normGroup($('#sg').value), u = shareUrl(g);
    $('#qrbigt').textContent = g ? `Итоговый тест · группа ${g}` : 'Итоговый тест'; $('#qrbigl').textContent = u;
    $('#qrbig').classList.add('on'); drawQr($('#qrbigc'), u, 720); };
  upd();
}
$('#qrbigx').onclick = () => $('#qrbig').classList.remove('on');

/* --- демо-данные --- */
function seedDemo(){
  const sur = ['Иванова','Петров','Смирнова','Кузнецов','Соколова','Попов','Лебедева','Козлов','Новикова','Морозов','Волкова','Павлов'];
  const nm = ['Анна','Дмитрий','Елена','Сергей','Мария','Алексей','Ольга','Игорь','Наталья','Андрей','Ирина','Павел'];
  const db = ls.get(K.demo, []), now = Date.now();
  ['12', '13', '14'].forEach((g, gi) => sur.slice(gi * 4, gi * 4 + 4 + (gi === 1 ? 2 : 0)).forEach((s, si) => {
    const skill = .45 + Math.random() * .5, tries = Math.random() < .2 ? 2 : 1;
    for (let t = 1; t <= tries; t++){
      const answers = Q.map(q => {
        const right = Math.random() < skill + (t - 1) * .2;
        if (right) return Array.isArray(q.a) ? q.a.slice() : q.a;
        if (q.t === 'one'){ let w; do { w = Math.floor(Math.random() * q.o.length); } while (w === q.a); return w; }
        if (q.t === 'many') return [q.a[0], 1, 4].filter((v, i, a) => a.indexOf(v) === i);
        return q.a.slice().sort(() => Math.random() - .5);
      });
      const g2 = grade(answers), fin = new Date(now - (2 - gi) * 7 * 864e5 - si * 60e3 - (tries - t) * 15 * 60e3 - 3600e3), dur = 300 + Math.floor(Math.random() * 600);
      db.push({id: uid(), surname: s, name: nm[sur.indexOf(s)], group: g, startedAt: new Date(fin - dur * 1e3).toISOString(),
        finishedAt: fin.toISOString(), durationSec: dur, answers, score: g2.score, total: g2.total, pct: g2.pct, passed: g2.passed, attempt: t});
    }
  }));
  ls.set(K.demo, db);
}

/* ======================= ЗАПУСК ======================= */
async function boot(){
  const p = new URLSearchParams(location.search);
  $('#demo').hidden = true;
  if (DEMO && !p.has('trainer')){
    $('#demo').hidden = false;
    $('#demo').innerHTML = '<b>Демо-режим.</b> Google Таблица ещё не подключена — результаты сохраняются только в этом браузере.';
  }
  if (p.has('trainer') || ss.get(K.trainer, null)){
    T.pwd = ss.get(K.trainer, null);
    if (T.pwd){
      $('#app').innerHTML = '<div class="empty">Загружаем результаты…</div>';
      const r = await loadResults();
      if (r === true) return showTrainer();
      ss.del(K.trainer); return showTrainerLogin(r);
    }
    return showTrainerLogin();
  }
  if (ls.get(K.outbox, []).length) flushOutbox();
  if (S && S.result) return showResult();
  if (S && S.user && Array.isArray(S.answers)) return showQuestion();
  showLogin(normGroup(p.get('group') || ''));
}
document.addEventListener('DOMContentLoaded', boot);
