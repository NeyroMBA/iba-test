<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EAE5">
<title>Анкета участника — Визуализация данных</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--lime:#BFE74B;--lime-d:#6E9A12;--ink:#0A0605;--blue:#41559A;--red:#D7263D;--green:#1B8A4C;
  --amber:#B7791F;--muted:#5E635B;--line:#D9DCD4;--paper:#FAFBF8;--kick:#7A7E77;--bg:#E9EAE5;
  --card:#fff;--soft:#EEF0EA;
  --s1:#D7263D;--s2:#EF8A4C;--s3:#E2C044;--s4:#9CC64B;--s5:#1B8A4C}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Gilroy','Onest','Inter','Segoe UI',Arial,sans-serif;font-size:18px;line-height:1.45}
[hidden]{display:none!important}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}
header.top img{height:44px;display:block}
.kick,header.top span{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--kick)}
h1{font-size:40px;line-height:1.08;letter-spacing:-.03em;margin:0 0 12px}
h1 em{font-style:normal;color:var(--lime-d)}
h2{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.lead{font-size:19px;color:var(--muted);margin:0 0 22px;max-width:720px}
.small{font-size:15px;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px;
  box-shadow:0 10px 30px rgba(10,6,5,.05)}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:99px;padding:14px 28px;
  cursor:pointer;background:var(--lime);color:var(--ink);transition:transform .1s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:50px}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:var(--soft);color:#2D2D2D}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{font-size:15px;padding:9px 16px;min-height:40px}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.sb:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.demo{background:#FFF7DB;border:1px solid #F0DC9A;color:#5C4A12;border-radius:14px;padding:12px 16px;
  font-size:15px;margin:-8px 0 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot{text-align:center;margin:26px 0 0;font-size:15px}
.foot a{color:var(--muted)}

/* ---------- вход ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;grid-template-areas:'intro form' 'rules form';gap:0 34px;align-items:start}
.hero .intro{grid-area:intro}.hero .rules{grid-area:rules}.hero .login{grid-area:form}
.facts{list-style:none;padding:0;margin:0 0 24px;display:flex;gap:12px;flex-wrap:wrap}
.facts li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:120px}
.facts b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.facts span{font-size:14px;color:var(--muted)}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;font-size:16px;color:#2D2D2D;align-items:flex-start}
.rules li i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--lime);font-style:normal;
  font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.sign{font-size:16px;color:var(--muted);margin:18px 0 0}
.fld{display:block;margin:16px 0 0}
.fld>span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input,.ctl{width:100%;font:inherit;font-size:18px;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--paper);color:var(--ink);min-height:52px}
.fld select{width:100%;font:inherit;font-size:18px;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);min-height:52px}
.fld select.bad{border-color:var(--red);background:#FDF0F1}
.fld input:focus,.fld select:focus,textarea:focus{border-color:var(--blue);outline:none;background:#fff}
.fld input.bad{border-color:var(--red);background:#FDF0F1}
.err{color:var(--red);font-size:15px;min-height:22px;margin:10px 0 6px}

/* ---------- разделы анкеты ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.who{font-size:15px;color:var(--muted);font-weight:600}
.num{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--kick)}
.bar{height:6px;background:#DADDD4;border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s ease}
.sec{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 18px}
.item{padding:20px 0;border-top:1px solid var(--line);scroll-margin-top:16px}
.item:first-of-type{border-top:0;padding-top:0}
.q{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.3;margin:0 0 6px}
.q .req{color:var(--red)}
.hintline{font-size:15px;color:var(--muted);margin:0 0 14px}
.item.bad .q{color:var(--red)}
.item .ierr{color:var(--red);font-size:15px;margin:8px 0 0;display:none}
.item.bad .ierr{display:block}
.opts{display:flex;flex-direction:column;gap:10px;margin:12px 0 0}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);width:100%;text-align:left;
  background:var(--paper);border-radius:14px;padding:14px 18px;cursor:pointer;color:var(--ink);
  font:inherit;font-size:18px;line-height:1.35;transition:border-color .15s,background .15s;min-height:56px}
.opt:hover{border-color:#B9BDB4}
.opt .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #B9BDB4;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.opt.on{border-color:var(--blue);background:#EEF2FB}
.opt.on .mk{background:var(--blue);border-color:var(--blue)}
textarea.ta{width:100%;font:inherit;font-size:18px;line-height:1.45;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--paper);color:var(--ink);min-height:120px;resize:vertical;margin-top:8px}
.cnt{font-size:13px;color:var(--kick);text-align:right;margin-top:4px}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 0 8px}
.srows{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--paper);border:1.5px solid transparent}
.srow.miss{border-color:#F3C2C8}
.srow .lbl{font-size:17px;font-weight:600;line-height:1.3}
.sbtns{display:flex;gap:6px}
.sb{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;
  font-size:17px;cursor:pointer;color:#2D2D2D;transition:background .12s,border-color .12s,color .12s}
.sb:hover{border-color:#9EA39A}
.sb.on{color:#fff;border-color:transparent}
.sb.on[data-v="1"]{background:var(--s1)}.sb.on[data-v="2"]{background:var(--s2)}.sb.on[data-v="3"]{background:var(--s3);color:var(--ink)}
.sb.on[data-v="4"]{background:var(--s4);color:var(--ink)}.sb.on[data-v="5"]{background:var(--s5)}
.actions,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.actions{margin-top:24px}
.actions .grow,.row .grow{flex:1}
.state{font-size:15px;color:var(--muted)}

/* ---------- спасибо ---------- */
.thanks{text-align:center;max-width:640px;margin:0 auto}
.thanks .ok{width:96px;height:96px;border-radius:50%;background:var(--lime);display:grid;place-items:center;
  font-size:48px;font-weight:900;margin:6px auto 18px}
.thanks h2{font-size:34px;margin-bottom:10px}
.send{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;
  font-size:15px;margin:18px 0;background:var(--soft)}
.send.ok{background:#EFF8F2;color:#145C34}
.send.bad{background:#FDF0F1;color:#8E1525}
.thanks .row{justify-content:center}

/* ---------- оверлеи ---------- */
#modal{position:fixed;inset:0;background:rgba(10,6,5,.45);display:none;z-index:50;overflow:auto;padding:24px 14px}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:20px;max-width:820px;margin:0 auto;padding:26px 28px;position:relative}
#modal .x{position:absolute;top:14px;right:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);opacity:0;background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;z-index:80;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#qrbig{position:fixed;inset:0;background:#fff;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#qrbig.on{display:flex}
#qrbig .qrc{width:min(70vh,86vw);height:min(70vh,86vw)}
#qrbig .qrc img,#qrbig .qrc canvas{width:100%!important;height:auto!important}
#qrbig h2{font-size:clamp(22px,4vw,44px);margin:0}
#qrbig p{margin:0;color:var(--muted);font-size:clamp(14px,1.8vw,22px);word-break:break-all}

/* ---------- панель тренера ---------- */
.thead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.thead h1{font-size:34px;margin:0}
.thead .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#DFE1DA;padding:5px;border-radius:99px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font:inherit;font-size:15px;font-weight:700;border:0;background:transparent;
  border-radius:99px;padding:10px 16px;cursor:pointer;color:#2D2D2D;min-height:44px}
.tabs button.on{background:#fff;box-shadow:0 2px 8px rgba(10,6,5,.08)}
.filters{display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr 1.4fr;gap:10px;align-items:end;margin-bottom:16px}
.filters label>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.ctl{font-size:16px;padding:9px 12px;min-height:44px;border-radius:12px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:14px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel .sub{font-size:14px;color:var(--muted);margin:0 0 14px}
.grid2p{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hb{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 54px;gap:12px;align-items:center;padding:7px 0;font-size:16px}
.hb s{display:block;height:12px;border-radius:99px;background:#EEF0EA;overflow:hidden;text-decoration:none}
.hb s i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.hb b{text-align:right}
.hb em{font-style:normal;color:var(--muted);font-size:13px;display:block}
.dist{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#EEF0EA}
.dist i{display:block;height:100%}
.dist i.d1{background:var(--s1)}.dist i.d2{background:var(--s2)}.dist i.d3{background:var(--s3)}.dist i.d4{background:var(--s4)}.dist i.d5{background:var(--s5)}
.avg{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:3px 8px;border-radius:99px;font-weight:800;font-size:15px}
.dlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 10px}
.dlegend span{display:inline-flex;align-items:center;gap:5px}
.dlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{text-align:left;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--kick);
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid #EEF0EA;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#F7F8F4}
.cards{display:none}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
.rc .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.rc .l2{font-size:14px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:16px}
.fb{border-top:1px solid #EEF0EA;padding:12px 0}
.fb:first-of-type{border-top:0}
.fb p{margin:0 0 4px;font-size:17px;line-height:1.45;white-space:pre-wrap}
.fb span{font-size:13px;color:var(--muted)}
.det dt{font-size:14px;font-weight:700;color:var(--muted);margin-top:14px}
.det dd{margin:4px 0 0;font-size:17px;white-space:pre-wrap}
.det .srate{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:16px;padding:3px 0;border-bottom:1px dashed #EEF0EA}
.qrwrap{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
#qrbox{width:280px;height:280px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;place-items:center}
#qrbox img,#qrbox canvas{width:100%!important;height:auto!important}
.linkline{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;word-break:break-all;margin:10px 0}

/* ---------- дашборд анкеты ---------- */
.wrap.wide{max-width:1320px}
:root{--good:#1B8A4C;--mid:#E2C044;--low:#D7263D;--col:#EF8A4C}
.dtool{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kbig{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kbig .t{font-size:17px;font-weight:700;color:#2D2D2D}
.kbig .v{font-size:48px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:6px 0 6px;color:var(--ink)}
.kbig.sm .t{font-size:14px;font-weight:600;color:var(--muted);order:2}
.kbig.sm .v{font-size:28px;margin:0 0 4px;order:1}
.kbig.sm .v.txt{font-size:18px;line-height:1.25}
.kbig.sm .pill{order:3;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#2D2D2D}
.pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dash{display:flex;gap:12px;align-items:flex-start}
.dcol{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1 1 0}
.dcol.c2{flex-grow:1.25}
.dp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.dp h3{font-size:17px;margin:0 0 12px;line-height:1.25}
.cols{display:flex;align-items:flex-end;gap:10px;height:190px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.col b{font-size:15px;margin-bottom:4px}
.col i{display:block;width:72%;max-width:64px;background:var(--col);border-radius:4px 4px 0 0;min-height:2px}
.col:hover i{filter:brightness(.92)}
.clabels{display:flex;gap:10px;margin-top:8px}
.clabels span{flex:1;text-align:center;font-size:13px;color:var(--muted);line-height:1.25}
.rbar{display:grid;grid-template-columns:minmax(110px,44%) 1fr;gap:10px;align-items:center;padding:3px 0;font-size:14px;cursor:default}
.rbar .n{text-align:right;color:#2D2D2D;line-height:1.2}
.rbar .tr{display:flex;align-items:center;gap:8px}
.rbar .tr s{flex:1;display:block;text-decoration:none}
.rbar .tr i{display:block;height:20px;border-radius:0 4px 4px 0}
.rbar:hover .tr i{filter:brightness(.92)}
.rbar .tr b{font-size:14px;min-width:28px}
.rlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.rlegend span{display:inline-flex;align-items:center;gap:5px}
.rlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cl+.cl{margin-top:16px}
.cl h4{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.cl h4 em{font-style:normal;color:var(--kick);font-weight:600}
.cl ul{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;border-top:1px solid var(--line)}
.cl li{padding:8px 2px;border-bottom:1px solid #EEF0EA;font-size:14px;line-height:1.4;white-space:pre-wrap}
.cl li span{display:block;font-size:12px;color:var(--kick);margin-top:2px;white-space:normal}
#tip{position:fixed;z-index:90;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;
  pointer-events:none;opacity:0;transition:opacity .1s;max-width:280px;left:0;top:0}
#tip.on{opacity:1}
@media (max-width:1100px){.dash{flex-wrap:wrap}.dcol{flex:1 1 calc(50% - 6px)}.dcol.c3{flex-basis:100%}}
@media (max-width:760px){
  .kp4{grid-template-columns:1fr 1fr}
  .kbig .v{font-size:36px}
  .dcol,.dcol.c3{flex-basis:100%}
}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;grid-template-areas:'intro' 'form' 'rules';gap:0}
  .hero .login{margin-bottom:22px}
  .facts{margin-bottom:18px}
  .filters{grid-template-columns:1fr 1fr}
  .filters .fsearch{grid-column:1/-1}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2p{grid-template-columns:1fr}
  .qrwrap{grid-template-columns:1fr}
}
@media (max-width:720px){
  html,body{font-size:17px}
  .wrap{padding:14px 14px 40px}
  header.top{margin-bottom:18px;padding-bottom:12px}
  header.top img{height:34px}
  header.top span{font-size:11px;letter-spacing:.1em;text-align:right;max-width:52%}
  .demo{font-size:14px;padding:10px 12px;margin:-4px 0 16px}
  .card{padding:20px 16px;border-radius:18px}
  h1{font-size:28px}
  .lead{font-size:17px}
  .facts li{min-width:0;flex:1;padding:10px 12px}
  .facts b{font-size:22px}
  .sec{font-size:24px}
  .q{font-size:19px}
  .opt{font-size:17px;padding:12px 14px}
  .srow{grid-template-columns:1fr;gap:8px;padding:12px}
  .sbtns{justify-content:space-between}
  .sb{flex:1;max-width:60px;height:48px}
  .actions{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 18px);
    margin:16px -16px -20px;padding:22px 16px calc(14px + env(safe-area-inset-bottom));border-radius:0 0 18px 18px}
  .actions .btn{flex:1;padding:14px 16px}
  .actions .state{flex-basis:100%;order:-1;text-align:center}
  .actions .grow{display:none}
  .thanks h2{font-size:28px}
  .thead h1{font-size:26px}
  .tabs .lg{display:none}
  .tabs button{padding:10px 10px;font-size:14px}
  .tbl.desk{display:none}
  .cards{display:block}
  .hb{grid-template-columns:1fr 54px;row-gap:4px}
  .hb .hl{grid-column:1/-1}
  #modal .box{padding:22px 16px}

<div id="modal" role="dialog"><div class="box"><button class="btn ghost sm x" id="mclose">✕</button><div id="mbody"></div></div></div>
<div id="qrbig"><div class="qrc" id="qrbigc"></div><h2 id="qrbigt"></h2><p id="qrbigl"></p>
  <button class="btn ghost" id="qrbigx">Закрыть</button></div>
<div id="toast"></div>
<div id="tip" role="tooltip"></div>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const CONFIG = {
  // Тот же адрес веб-приложения Google Apps Script, что и у итогового теста.
  // Пусто — демо-режим: ответы хранятся только в этом браузере.
  API_URL: 'https://script.google.com/macros/s/AKfycbxckKIQZr11lHgEvjKf3xImZSsOUjSytViYQEu4Vpw2Azg-o3Lx-Ruckd9yEOsKc_GvzQ/exec',
  ONE_RESPONSE: true,      // одна анкета на участника (фамилия + имя + группа)
  MINUTES: 5,
  TEST_URL: '../',         // итоговый тест (ссылка из панели тренера)
  TRAINERS: ['Шмаль Елена', 'Филенкова Дарья', 'Зыкина Анна', 'Колоколов Алексей'],   // список «Тренер» в анкете
  DEMO_TRAINER_PASSWORD: 'trainer'
};

/* ======================= ВОПРОСЫ АНКЕТЫ =======================
   type: "choice" — один вариант, "text" — свободный ответ, "scale" — оценки 1–5 по строкам.
   col — заголовок столбца в таблице; для "scale" столбцы называются «prefix: строка». */
const SURVEY = {
  title: 'Анкета участника тренинга <em>«Визуализация данных»</em>',
  intro: 'Мы хотим обучать сотрудников компаний лучше, чем это делают остальные. Поэтому нам важно ваше мнение. Пожалуйста, заполните анкету — это займёт не больше 5 минут.',
  sign: 'С уважением, Институт бизнес-аналитики',
  sections: [
    {title: 'Применение и результат', items: [
      {id: 'freq', type: 'choice', col: 'Как часто будет применять навыки', required: true,
        q: 'Как часто вы будете применять навыки с обучения?',
        o: ['Каждый день', 'Раз в неделю', 'Раз в месяц', 'Редко, несколько раз в год']},
      {id: 'result', type: 'text', col: 'Главный результат',
        q: 'Что вы считаете своим главным результатом от тренинга?'}
    ]},
    {title: 'Качество обучения', items: [
      {id: 'quality', type: 'scale', prefix: 'Качество',
        q: 'Оцените, пожалуйста, качество лекций, практических занятий и обратной связи',
        rows: ['Лекции', 'Практические занятия', 'Обратная связь']}
    ]},
    {title: 'Учебная часть', items: [
      {id: 'topics', type: 'scale', prefix: 'Тема',
        q: 'Какие темы оказались для вас наиболее интересными и полезными?',
        rows: ['Правила визуализации данных', 'Нестандартная визуализация', 'Подготовка данных', 'Обработка данных',
          'Информационные панели (дашборды)', 'Power Pivot (модель данных)', 'Дизайн дашборда и цветовая схема', 'Power Query']}
    ]},
    {title: 'Творческие задания', items: [
      {id: 'tasks', type: 'scale', prefix: 'Задание',
        q: 'Какие творческие задания оказались для вас наиболее интересными и полезными?',
        rows: ['Визуализация тезисов', 'Нестандартная диаграмма', 'Макет годового отчёта']}
    ]},
    {title: 'Ваш отзыв', items: [
      {id: 'liked', type: 'text', col: 'Что больше всего понравилось', q: 'Что вам больше всего понравилось?'},
      {id: 'improve', type: 'text', col: 'Что стоит доработать', required: true, q: 'Что стоит доработать (добавить, убрать)?'}
    ]}
  ]
};
</script>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO = !CONFIG.API_URL;
const K = {state: 'ibaSV.state.v1', outbox: 'ibaSV.outbox.v1', demo: 'ibaSV.demoDB.v1', trainer: 'ibaFT.trainer.v1',
  last: 'iba.lastUser.v1', test: 'ibaFT.state.v1'};
const mkStore = area => ({
  get(k, d){ try { const v = area().getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { area().setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { area().removeItem(k); } catch(e){} }
});
const ls = mkStore(() => localStorage), ss = mkStore(() => sessionStorage);
const uid = () => { try { return crypto.randomUUID(); } catch(e){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } };
const normName = s => String(s).replace(/\s+/g, ' ').trim().toLowerCase()
  .replace(/(^|[\s-])(\S)/g, (m, a, b) => a + b.toUpperCase());
const normGroup = s => String(s).replace(/\s+/g, ' ').trim()
  .replace(/^(группа|гр\.?)\s*/i, '').replace(/^№\s*/, '').toUpperCase();
const personKey = r => [r.surname, r.name, r.group].map(s => String(s).toLowerCase().replace(/ё/g, 'е')).join('|');
const pad = n => String(n).padStart(2, '0');
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '—' :
  `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
const setKicker = t => $('#kicker').textContent = t;
const top0 = () => window.scrollTo({top: 0, behavior: 'smooth'});
const fmtAvg = v => v == null ? '—' : v.toFixed(1).replace('.', ',');
const avgColor = v => v == null ? '#EEF0EA' : v >= 4.5 ? '#D6EFDF' : v >= 3.5 ? '#E9F4D2' : v >= 2.5 ? '#FBF0C9' : '#FBE0E3';

/* ---------- столбцы анкеты ---------- */
const COLS = [];
for (const s of SURVEY.sections) for (const it of s.items){
  if (it.type === 'scale') it.rows.forEach(r => COLS.push({it, row: r, h: `${it.prefix}: ${r}`}));
  else COLS.push({it, h: it.col});
}
const ITEMS = SURVEY.sections.flatMap(s => s.items);
const toFields = A => COLS.map(c => [c.h, c.row ? (A[c.it.id] || {})[c.row] ?? '' : A[c.it.id] ?? '']);

/* ---------- хранилище ---------- */
async function api(payload){
  if (DEMO) return demoApi(payload);
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(CONFIG.API_URL, {method: 'POST', body: JSON.stringify(payload), signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function demoApi(p){
  const db = ls.get(K.demo, []);
  if (p.action === 'survey_check'){
    const prev = db.find(x => personKey(x) === personKey(p));
    return {ok: true, taken: !!prev, finishedAt: prev ? prev.finishedAt : null};
  }
  if (p.action === 'survey_submit'){
    const r = p.record;
    if (!db.some(x => x.id === r.id)){
      const prev = db.find(x => personKey(x) === personKey(r));
      if (CONFIG.ONE_RESPONSE && prev) return {ok: false, error: 'already_taken', finishedAt: prev.finishedAt};
      db.push({id: r.id, finishedAt: r.finishedAt, surname: r.surname, name: r.name, group: r.group, f: Object.fromEntries(r.fields)});
      ls.set(K.demo, db);
    }
    return {ok: true};
  }
  if (p.action === 'survey_results'){
    if (p.password !== CONFIG.DEMO_TRAINER_PASSWORD) return {ok: false, error: 'auth'};
    return {ok: true, rows: db};
  }
  return {ok: false, error: 'unknown_action'};
}

/* ---------- отправка с повтором ---------- */
let flushing = false, retryTimer = null, sendFailed = false;
function outboxAdd(rec){ const box = ls.get(K.outbox, []); if (!box.some(r => r.id === rec.id)) box.push(rec); ls.set(K.outbox, box); }
async function flushOutbox(){
  if (flushing) return; flushing = true;
  let failed = false;
  try {
    for (const rec of ls.get(K.outbox, [])){
      try {
        const r = await api({action: 'survey_submit', record: rec});
        if (r && r.error === 'already_taken'){
          ls.set(K.outbox, ls.get(K.outbox, []).filter(x => x.id !== rec.id));
          if (S && S.done && S.done.rec.id === rec.id){ S.done.rejected = r.finishedAt || true; save(); }
          continue;
        }
        if (!r || !r.ok) throw new Error(r && r.error || 'error');
        ls.set(K.outbox, ls.get(K.outbox, []).filter(x => x.id !== rec.id));
        if (S && S.done && S.done.rec.id === rec.id){ S.done.sent = true; save(); }
      } catch(e){ failed = true; break; }
    }
  } finally { flushing = false; }
  sendFailed = failed;
  updateSendStatus();
  clearTimeout(retryTimer);
  if (failed) retryTimer = setTimeout(flushOutbox, 15000);
}
window.addEventListener('online', flushOutbox);

/* ======================= УЧАСТНИК ======================= */
let S = ls.get(K.state, null);
const save = () => ls.set(K.state, S);

function prefillUser(){
  const last = ls.get(K.last, null);
  if (last && last.surname) return last;
  const t = ls.get(K.test, null);
  return t && t.user ? t.user : {};
}
function showLogin(prefGroup = ''){
  setKicker('Анкета участника');
  const u = prefillUser(), g = prefGroup || u.group || '';
  $('#app').innerHTML = `
  <div class="hero">
    <section class="intro">
      <h1>${SURVEY.title}</h1>
      <p class="lead">${SURVEY.intro}</p>
    </section>
    <ul class="rules">
      <li><i>1</i><span>Обязательные вопросы отмечены <b style="color:var(--red)">*</b>, остальные — по желанию.</span></li>
      <li><i>2</i><span>Можно вернуться назад и поменять ответ, пока анкета не отправлена.</span></li>
    </ul>
    <form class="card login" id="f" novalidate>
      <h2>Представьтесь</h2>
      <p class="small">Ответы увидит только команда тренинга.${CONFIG.ONE_RESPONSE ? ' Анкету можно заполнить <b>один раз</b>.' : ''}</p>
      <label class="fld"><span>Фамилия</span><input name="surname" autocomplete="family-name" autocapitalize="words" enterkeyhint="next" required value="${esc(u.surname || '')}"></label>
      <label class="fld"><span>Имя</span><input name="name" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" required value="${esc(u.name || '')}"></label>
      <label class="fld"><span>Номер группы</span><input name="group" autocomplete="off" enterkeyhint="next" required value="${esc(g)}"></label>
      <label class="fld"><span>Тренер</span><select name="trainer" required>
        <option value="">Выберите тренера</option>
        ${CONFIG.TRAINERS.map(t => `<option ${t === u.trainer ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn wide">Заполнить анкету →</button>
      <p class="sign">${SURVEY.sign}</p>
    </form>
  </div>
  <p class="foot"><a href="?trainer" id="toTrainer">Вход для тренера</a></p>`;
  const f = $('#f');
  f.onsubmit = async e => {
    e.preventDefault();
    const v = {surname: normName(f.surname.value), name: normName(f.name.value), group: normGroup(f.group.value), trainer: f.trainer.value};
    let bad = null;
    for (const k of ['surname', 'name', 'group', 'trainer']){
      const short = k === 'group' || k === 'trainer' ? !v[k] : v[k].length < 2;
      f[k].classList.toggle('bad', short); if (short && !bad) bad = k;
    }
    if (bad){ $('#err').textContent = 'Заполните все поля: фамилию, имя, номер группы и выберите тренера.'; f[bad].focus(); return; }
    if (CONFIG.ONE_RESPONSE){
      const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Проверяем…';
      const r = await Promise.race([api({action: 'survey_check', surname: v.surname, name: v.name, group: v.group}).catch(() => null), new Promise(res => setTimeout(res, 8000))]);
      if (r && r.ok && r.taken) return showTaken(v, r.finishedAt);
    }
    ls.set(K.last, v);
    S = {user: v, startedAt: new Date().toISOString(), step: 0, A: {}, done: null};
    save(); showSection(); top0();
  };
  $('#toTrainer').onclick = e => { e.preventDefault(); showTrainerLogin(); };
}
function showTaken(user, when){
  $('#app').innerHTML = `
    <div class="card" style="max-width:640px;margin:0 auto">
      <h2>Анкета уже заполнена</h2>
      <p class="lead" style="margin:10px 0 18px"><b>${esc(user.surname)} ${esc(user.name)}</b>, группа ${esc(user.group)},
        уже заполнял(а) анкету${when ? ' ' + fmtDate(when) : ''}. Спасибо!</p>
      <p class="small">Если это ошибка или вы однофамилец из той же группы — обратитесь к тренеру.</p>
      <div class="row" style="margin-top:22px"><button type="button" class="btn ghost" id="back">← Назад</button></div>
    </div>`;
  $('#back').onclick = () => { showLogin(user.group); top0(); };
}

function itemHtml(it){
  const v = S.A[it.id], req = it.required ? ' <span class="req">*</span>' : '';
  let body = '';
  if (it.type === 'choice'){
    body = `<div class="opts" role="radiogroup">${it.o.map(o => `<button type="button" class="opt${v === o ? ' on' : ''}" role="radio"
      aria-checked="${v === o}" data-o="${esc(o)}"><span class="mk">${v === o ? '✓' : ''}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  } else if (it.type === 'text'){
    body = `<textarea class="ta" maxlength="2000" placeholder="Ваш ответ" aria-label="${esc(it.q)}">${esc(v || '')}</textarea>
      <div class="cnt"><span>${(v || '').length}</span> / 2000</div>`;
  } else {
    const val = v || {};
    body = `<p class="hintline">Оцените каждую строку: 1 — совсем не понравилось / не пригодится, 5 — отлично</p>
      <div class="srows">${it.rows.map(r => `<div class="srow" data-r="${esc(r)}"><span class="lbl">${esc(r)}</span>
        <span class="sbtns" role="radiogroup" aria-label="${esc(r)}">${[1,2,3,4,5].map(n =>
          `<button type="button" class="sb${val[r] === n ? ' on' : ''}" data-v="${n}" role="radio" aria-checked="${val[r] === n}">${n}</button>`).join('')}</span></div>`).join('')}</div>`;
  }
  return `<div class="item" data-id="${it.id}"><p class="q">${esc(it.q)}${req}</p>${body}
    <p class="ierr">${it.type === 'choice' ? 'Выберите вариант ответа' : 'Напишите, пожалуйста, хотя бы пару слов'}</p></div>`;
}
function showSection(){
  setKicker('Анкета участника');
  const n = SURVEY.sections.length, i = S.step, sec = SURVEY.sections[i], last = i === n - 1;
  $('#app').innerHTML = `
    <div class="qtop"><span class="who">${esc(S.user.surname)} ${esc(S.user.name)} · группа ${esc(S.user.group)}${S.user.trainer ? ' · тренер ' + esc(S.user.trainer) : ''}</span>
      <span class="num">Раздел ${i + 1} из ${n}</span></div>
    <div class="bar"><i style="width:${i / n * 100}%"></i></div>
    <div class="card">
      <p class="sec">${esc(sec.title)}</p>
      ${sec.items.map(itemHtml).join('')}
      <div class="actions">
        ${i > 0 ? '<button type="button" class="btn ghost" id="back">← Назад</button>' : ''}
        <span class="state" id="state"></span><span class="grow"></span>
        <button type="button" class="btn" id="next">${last ? 'Отправить анкету' : 'Дальше →'}</button>
      </div>
    </div>`;
  for (const it of sec.items){
    const el = $(`.item[data-id="${it.id}"]`);
    if (it.type === 'choice') $$('.opt', el).forEach(b => b.onclick = () => {
      S.A[it.id] = b.dataset.o; save();
      $$('.opt', el).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); $('.mk', x).textContent = on ? '✓' : ''; });
      el.classList.remove('bad'); });
    else if (it.type === 'text'){ const ta = $('textarea', el);
      ta.oninput = () => { S.A[it.id] = ta.value; save(); $('.cnt span', el).textContent = ta.value.length;
        if (ta.value.trim().length >= 2) el.classList.remove('bad'); }; }
    else $$('.srow', el).forEach(row => $$('.sb', row).forEach(b => b.onclick = () => {
      const val = S.A[it.id] = S.A[it.id] || {}; val[row.dataset.r] = +b.dataset.v; save();
      $$('.sb', row).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
      row.classList.remove('miss'); updateState(); }));
  }
  if ($('#back')) $('#back').onclick = () => { S.step--; save(); showSection(); top0(); };
  $('#next').onclick = next;
  updateState();
}
function updateState(){
  const sec = SURVEY.sections[S.step], scales = sec.items.filter(it => it.type === 'scale');
  if (!scales.length) return $('#state').textContent = '';
  const total = scales.reduce((s, it) => s + it.rows.length, 0);
  const done = scales.reduce((s, it) => s + Object.keys(S.A[it.id] || {}).length, 0);
  $('#state').textContent = done < total ? `оценено ${done} из ${total}` : '';
}
function next(){
  const sec = SURVEY.sections[S.step];
  let firstBad = null;
  for (const it of sec.items){
    const el = $(`.item[data-id="${it.id}"]`), v = S.A[it.id];
    const bad = it.required && (it.type === 'choice' ? !v : it.type === 'text' ? !(v || '').trim() || v.trim().length < 2 : false);
    el.classList.toggle('bad', !!bad); if (bad && !firstBad) firstBad = el;
  }
  if (firstBad){ firstBad.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
  // пропущенные оценки не обязательны, но один раз подсветим их
  const missed = $$('.srow').filter(r => !$('.sb.on', r));
  if (missed.length && !S['warned' + S.step]){
    S['warned' + S.step] = true; save();
    missed.forEach(r => r.classList.add('miss'));
    $('#state').textContent = `Не оценено: ${missed.length}. Можно оценить или нажать «${S.step === SURVEY.sections.length - 1 ? 'Отправить анкету' : 'Дальше'}» ещё раз.`;
    missed[0].scrollIntoView({behavior: 'smooth', block: 'center'}); return;
  }
  if (S.step === SURVEY.sections.length - 1) return finish();
  S.step++; save(); showSection(); top0();
}
function finish(){
  const fin = new Date();
  const A = {...S.A};
  for (const it of ITEMS) if (it.type === 'text' && A[it.id]) A[it.id] = A[it.id].trim();
  const rec = {id: uid(), surname: S.user.surname, name: S.user.name, group: S.user.group,
    startedAt: S.startedAt, finishedAt: fin.toISOString(), fields: [['Тренер', S.user.trainer || ''], ...toFields(A)]};
  S.done = {rec, sent: false}; save(); outboxAdd(rec);
  sendFailed = false; showThanks(); top0(); flushOutbox();
}
function showThanks(){
  setKicker('Анкета участника');
  $('#app').innerHTML = `
    <div class="card thanks">
      <div class="ok">✓</div>
      <h2>Спасибо, ${esc(S.done.rec.name)}!</h2>
      <p class="lead" style="margin:0 auto">Ваши ответы помогут нам сделать обучение ещё лучше.</p>
      <div class="send" id="send"></div>
      <div class="row">
        <button type="button" class="btn ghost" id="exit">Завершить</button>
      </div>
    </div>`;
  $('#exit').onclick = () => {
    if (!S.done.sent && !S.done.rejected && !confirm('Ответы ещё не отправлены. Всё равно выйти? Отправка продолжится, когда вы снова откроете анкету на этом устройстве.')) return;
    S = null; ls.del(K.state); ls.del(K.last); showLogin(); top0();
  };
  updateSendStatus();
}
function updateSendStatus(){
  const el = $('#send'); if (!el || !S || !S.done) return;
  const r = S.done;
  if (r.rejected){
    el.className = 'send bad';
    el.textContent = `Эти ответы не сохранены: анкета под этим именем уже была заполнена${r.rejected !== true ? ' ' + fmtDate(r.rejected) : ''}.`;
  } else if (r.sent){
    el.className = 'send ok';
    el.textContent = DEMO ? '✓ Сохранено в демо-режиме (только в этом браузере)' : '✓ Ответы сохранены';
  } else if (sendFailed){
    el.className = 'send bad';
    el.innerHTML = 'Не удалось отправить ответы — проверьте интернет. Пробуем снова автоматически. <button class="btn sm dark" id="retry">Повторить сейчас</button>';

async function loadResults(){
  try {
    const r = await api({action: 'survey_results', password: T.pwd});
    if (!r.ok) return r.error === 'auth' ? 'Неверный пароль.'
      : r.error === 'unknown_action' ? 'Скрипт Google Таблицы ещё не обновлён для анкеты.' : 'Ошибка сервера: ' + (r.error || 'неизвестно');

    return true;
  } catch(e){ return 'Не удалось загрузить ответы. Проверьте интернет и адрес API.'; }
}
function filtered(){
  const f = T.f, q = f.q.trim().toLowerCase();
  return T.rows.filter(r =>
    (!f.group || r.group === f.group) && (!f.trainer || (r.f['Тренер'] || '') === f.trainer) &&
    (!f.from || dayKey(r.finishedAt) >= f.from) && (!f.to || dayKey(r.finishedAt) <= f.to) &&
    (!q || `${r.surname} ${r.name}`.toLowerCase().includes(q) ||
      ITEMS.some(it => it.type === 'text' && String(r.f[it.col] || '').toLowerCase().includes(q))));
}
const trainersList = () => [...new Set([...CONFIG.TRAINERS, ...T.rows.map(r => r.f['Тренер']).filter(Boolean)])];
const groupsList = () => [...new Set(T.rows.map(r => r.group))].sort((a, b) => a.localeCompare(b, 'ru', {numeric: true}));
function stat(rows, h){
  const d = [0, 0, 0, 0, 0]; let s = 0, n = 0;
  for (const r of rows){ const v = +r.f[h]; if (v >= 1 && v <= 5){ d[v - 1]++; s += v; n++; } }
  return {d, n, avg: n ? s / n : null};
}

/* --- вкладка «Дашборд» --- */
const status = v => v == null ? {c: '#D9DCD4', t: 'нет оценок'} : v >= 4.5 ? {c: 'var(--good)', t: 'отлично'}
  : v >= 4 ? {c: 'var(--mid)', t: 'хорошо'} : {c: 'var(--low)', t: 'есть над чем работать'};
const pill = v => `<span class="pill"><i style="background:${status(v).c}"></i>${status(v).t}</span>`;
const tipStat = (name, st) => `<b>${esc(name)}</b><br>Средняя: ${fmtAvg(st.avg)} · ${st.n} ${plural(st.n,'оценка','оценки','оценок')}`
  + (st.n ? `<br>${st.d.map((c, k) => `«${k + 1}» — ${c}`).join(', ')}` : '');
function pooled(rows, it){
  let s = 0, n = 0;
  for (const r of it.rows){ const st = stat(rows, `${it.prefix}: ${r}`); s += (st.avg || 0) * st.n; n += st.n; }
  return {avg: n ? s / n : null, n};
}
const rbar = (name, st, tip) => `<div class="rbar" data-tip="${esc(tip || tipStat(name, st))}"><span class="n">${esc(name)}</span>
  <span class="tr"><s><i style="width:${st.avg ? st.avg / 5 * 100 : 0}%;background:${status(st.avg).c}"></i></s><b>${fmtAvg(st.avg)}</b></span></div>`;
const rlegend = `<div class="rlegend"><span><i style="background:var(--good)"></i>4,5–5 отлично</span>
  <span><i style="background:var(--mid)"></i>4,0–4,4 хорошо</span><span><i style="background:var(--low)"></i>ниже 4,0</span></div>`;
function ratingPanel(it, rows, area, title){
  const list = it.rows.map(r => ({r, st: stat(rows, `${it.prefix}: ${r}`)})).sort((a, b) => (b.st.avg ?? -1) - (a.st.avg ?? -1));
  return `<div class="dp ${area}"><h3>${title}</h3>${list.map(x => rbar(x.r, x.st)).join('')}${rlegend}</div>`;
}
function tabSummary(){
  const rows = filtered(), n = rows.length;
  const byIt = id => ITEMS.find(it => it.id === id);
  const qual = byIt('quality'), topics = byIt('topics'), tasks = byIt('tasks'), freq = byIt('freq');

  const q = qual.rows.map(r => ({r, st: stat(rows, `${qual.prefix}: ${r}`)}));
  const qp = pooled(rows, qual);
  const best = it => it.rows.map(r => ({r, st: stat(rows, `${it.prefix}: ${r}`)})).filter(x => x.st.n).sort((a, b) => b.st.avg - a.st.avg)[0];
  const bTopic = best(topics), bTask = best(tasks);
  const fc = freq.o.map(o => rows.filter(r => r.f[freq.col] === o).length), fmax = Math.max(1, ...fc);
  const often = Math.round((fc[0] + fc[1]) / n * 100);
  const people = new Set(rows.map(personKey)).size;
  const shortQ = {'Лекции': 'Лекции, теория', 'Практические занятия': 'Практика', 'Обратная связь': 'Обратная связь'};
  const comments = [['liked', 'Понравилось'], ['result', 'Главный результат'], ['improve', 'Стоит доработать']].map(([id, t]) => {
    const it = byIt(id), list = rows.filter(r => String(r.f[it.col] || '').trim()).sort((a, b) => b.finishedAt.localeCompare(a.finishedAt));

      : '<li style="color:var(--muted)">Пока нет ответов</li>'}</ul></div>`;

  const act = [['Качество обучения', qual], ['Учебная часть', topics], ['Творческие задания', tasks]].map(([t, it]) => {
    const st = pooled(rows, it);
    return rbar(t, st, `<b>${t}</b><br>Средняя по всем пунктам: ${fmtAvg(st.avg)} · ${st.n} ${plural(st.n,'оценка','оценки','оценок')}`);
  }).join('');
  $('#tab').innerHTML = `
    <div class="dtool"><span>${n} ${plural(n,'анкета','анкеты','анкет')} по выбранным фильтрам · наведите на график, чтобы увидеть детали</span>
      <button class="btn sm" id="xlsx">⬇ Скачать Excel</button></div>
    <div class="kp4">
      ${q.map(x => `<div class="kbig" data-tip="${esc(tipStat(x.r, x.st))}"><div class="t">${esc(shortQ[x.r] || x.r)}</div>
        <div class="v">${fmtAvg(x.st.avg)}</div>${pill(x.st.avg)}</div>`).join('')}
      <div class="kbig"><div class="t">Кол-во слушателей</div><div class="v">${people}</div>
        <span class="pill">${n} ${plural(n,'анкета','анкеты','анкет')}</span></div>
    </div>
    <div class="kp4">
      <div class="kbig sm"><div class="t">средняя оценка обучения</div><div class="v">${fmtAvg(qp.avg)}</div>${pill(qp.avg)}</div>
      <div class="kbig sm"><div class="t">применят еженедельно или чаще</div><div class="v">${often}%</div></div>
      <div class="kbig sm"><div class="t">самая полезная тема${bTopic ? ' · ' + fmtAvg(bTopic.st.avg) : ''}</div><div class="v txt">${bTopic ? esc(bTopic.r) : '—'}</div></div>
      <div class="kbig sm"><div class="t">лучшее творческое задание${bTask ? ' · ' + fmtAvg(bTask.st.avg) : ''}</div><div class="v txt">${bTask ? esc(bTask.r) : '—'}</div></div>
    </div>
    <div class="dash"><div class="dcol c1">
      <div class="dp a-freq"><h3>Частота применения навыков с обучения</h3>
        <div class="cols">${fc.map((c, k) => `<div class="col" data-tip="${esc(`<b>${esc(freq.o[k])}</b><br>${c} ${plural(c,'человек','человека','человек')} · ${Math.round(c / n * 100)}%`)}">
          <b>${c}</b><i style="height:${c / fmax * 82}%"></i></div>`).join('')}</div>
        <div class="clabels">${freq.o.map(o => `<span>${esc(o)}</span>`).join('')}</div></div>
      <div class="dp a-act"><h3>Оценка по видам деятельности</h3>${act}</div></div>
      <div class="dcol c2">${ratingPanel(topics, rows, 'a-topics', 'Оценка по темам учебной части')}
      ${ratingPanel(tasks, rows, 'a-tasks', 'Оценка по темам творческих заданий')}</div>
      <div class="dcol c3"><div class="dp a-comm"><h3>Комментарии</h3>${comments}</div></div>
    </div>`;
  $('#xlsx').onclick = () => exportXlsx(rows);
}

(() => {

    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px';

    if (!t){ tip.classList.remove('on'); return; } const r = t.getBoundingClientRect();
    tip.innerHTML = t.dataset.tip; tip.classList.add('on'); place(r.left + r.width / 2 - 20, r.top + r.height / 2); });
  addEventListener('scroll', () => tip.classList.remove('on'), {passive: true});
})();

/* --- Excel --- */
const loadScript = (src, test) => test() ? Promise.resolve() : new Promise((res, rej) => {
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(); };
  document.head.appendChild(s); });
const xlDate = iso => { const d = new Date(iso);
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) / 864e5 + 25569; };
async function exportXlsx(rows){
  const btn = $('#xlsx'); btn.disabled = true; btn.textContent = 'Готовим файл…';
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => window.XLSX); }
  catch(e){ btn.disabled = false; btn.textContent = '⬇ Скачать Excel'; return toast('Не удалось загрузить модуль Excel — проверьте интернет'); }
  const sheet = (aoa, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({wch: w}));
    ws['!autofilter'] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: aoa.length - 1, c: aoa[0].length - 1}})}; return ws; };
  const sorted = rows.slice().sort((a, b) => a.finishedAt.localeCompare(b.finishedAt));
  const answers = [['Дата', 'Фамилия', 'Имя', 'Группа', 'Тренер', ...COLS.map(c => c.h)]];
  for (const r of sorted) answers.push([{t: 'n', v: xlDate(r.finishedAt), z: 'dd.mm.yyyy hh:mm'}, r.surname, r.name,
    /^\d+$/.test(r.group) ? +r.group : r.group, r.f['Тренер'] || '',
    ...COLS.map(c => { const v = r.f[c.h]; return c.it.type === 'scale' && v !== '' && v != null ? +v : (v ?? ''); })]);
  const groups = [...new Set(sorted.map(r => r.group))].sort((a, b) => a.localeCompare(b, 'ru', {numeric: true}));
  const trs = [...new Set(sorted.map(r => r.f['Тренер']).filter(Boolean))];
  const scores = [['Раздел', 'Пункт', 'Средняя', 'Оценок', '1', '2', '3', '4', '5', ...groups.map(g => 'Группа ' + g), ...trs]];
  for (const c of COLS.filter(c => c.it.type === 'scale')){
    const st = stat(sorted, c.h);
    scores.push([c.it.prefix, c.row, st.avg == null ? '' : {t: 'n', v: Math.round(st.avg * 100) / 100, z: '0.00'}, st.n, ...st.d,
      ...groups.map(g => { const s2 = stat(sorted.filter(r => r.group === g), c.h); return s2.avg == null ? '' : {t: 'n', v: Math.round(s2.avg * 100) / 100, z: '0.00'}; }),
      ...trs.map(t => { const s2 = stat(sorted.filter(r => r.f['Тренер'] === t), c.h); return s2.avg == null ? '' : {t: 'n', v: Math.round(s2.avg * 100) / 100, z: '0.00'}; })]);
  }
  const freq = ITEMS.find(it => it.id === 'freq');
  const fr = [['Как часто будет применять', 'Ответов', 'Доля, %']];
  freq.o.forEach(o => { const c = sorted.filter(r => r.f[freq.col] === o).length; fr.push([o, c, sorted.length ? Math.round(c / sorted.length * 100) : 0]); });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(answers, [17, 16, 14, 9, 18, ...COLS.map(c => c.it.type === 'scale' ? 12 : 40)]), 'Ответы');
  XLSX.utils.book_append_sheet(wb, sheet(scores, [10, 36, 9, 8, 5, 5, 5, 5, 5, ...groups.map(() => 11), ...trs.map(() => 17)]), 'Оценки');
  XLSX.utils.book_append_sheet(wb, sheet(fr, [30, 10, 10]), 'Применение');
  XLSX.writeFile(wb, `Анкета_${T.f.group ? 'группа_' + T.f.group + '_' : ''}${T.f.trainer ? T.f.trainer.replace(/\s+/g, '_') + '_' : ''}${dayKey(new Date())}.xlsx`);
  btn.disabled = false; btn.textContent = '⬇ Скачать Excel';
}

/* --- Ссылка и QR --- */
const baseUrl = () => location.href.split(/[?#]/)[0];
const shareUrl = g => baseUrl() + (g ? '?group=' + encodeURIComponent(g) : '');
async function drawQr(el, text, size){
  el.innerHTML = '<span class="small">Создаём QR-код…</span>';
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', () => window.QRCode); el.innerHTML = '';
    new QRCode(el, {text, width: size, height: size, colorDark: '#0A0605', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
  } catch(e){ el.innerHTML = '<span class="small">Нет интернета — QR-код не создать. Ссылку можно скопировать.</span>'; }
}
function tabShare(){
  $('#tab').innerHTML = `
    <div class="panel qrwrap">
      <div>
        <h3>Ссылка на анкету</h3>
        <p class="small">Укажите номер группы — он подставится в форму автоматически. Можно оставить пустым.</p>
        <label class="fld"><span>Группа (необязательно)</span><input id="sg" class="ctl" value="${esc(T.f.group)}" placeholder="Например, 15 БР"></label>
        <div class="linkline" id="sl"></div>
        <div class="row"><button class="btn" id="scopy">Скопировать ссылку</button>
          <button class="btn dark" id="sbig">Показать QR на весь экран</button></div>
      </div>
      <div id="qrbox"></div>
    </div>`;
  const upd = () => { const u = shareUrl(normGroup($('#sg').value)); $('#sl').textContent = u; drawQr($('#qrbox'), u, 256); };
  let t; $('#sg').oninput = () => { clearTimeout(t); t = setTimeout(upd, 300); };
  $('#scopy').onclick = async () => { const u = $('#sl').textContent;
    try { await navigator.clipboard.writeText(u); toast('Ссылка скопирована'); } catch(e){ prompt('Скопируйте ссылку:', u); } };
  $('#sbig').onclick = () => { const g = normGroup($('#sg').value), u = shareUrl(g);
    $('#qrbigt').textContent = g ? `Анкета участника · группа ${g}` : 'Анкета участника'; $('#qrbigl').textContent = u;
    $('#qrbig').classList.add('on'); drawQr($('#qrbigc'), u, 720); };
  upd();
}
$('#qrbigx').onclick = () => $('#qrbig').classList.remove('on');

/* --- демо-данные --- */
function seedDemo(){
  const people = [['Иванова','Анна','15 БР'],['Петров','Дмитрий','15 БР'],['Смирнова','Елена','15 БР'],['Кузнецов','Сергей','15 БР'],
    ['Соколова','Мария','16'],['Попов','Алексей','16'],['Лебедева','Ольга','16'],['Козлов','Игорь','16'],['Новикова','Наталья','16']];
  const liked = ['Много практики на реальных примерах', 'Разбор наших дашбордов', 'Power Query — сэкономит часы работы', 'Подача материала и обратная связь', ''];
  const improve = ['Больше времени на Power Pivot', 'Добавить домашние задания между занятиями', 'Раздаточные материалы заранее', 'Всё отлично, ничего менять не нужно'];
  const db = ls.get(K.demo, []), now = Date.now();
  people.forEach(([s, n, g], i) => {
    const bias = 3 + Math.random() * 2, A = {freq: ITEMS[0].o[Math.min(3, Math.floor(Math.random() * 3.2))],
      result: ['Научился строить дашборды', 'Понимание, как выбирать диаграмму', 'Автоматизация отчётов через Power Query', ''][i % 4],
      liked: liked[i % liked.length], improve: improve[i % improve.length]};
    for (const it of ITEMS.filter(it => it.type === 'scale')){
      A[it.id] = {}; it.rows.forEach(r => { if (Math.random() < .93) A[it.id][r] = Math.max(1, Math.min(5, Math.round(bias + Math.random() * 1.6 - .8))); }); }
    db.push({id: uid(), surname: s, name: n, group: g, finishedAt: new Date(now - (g === '16' ? 1 : 8) * 864e5 - i * 4e5).toISOString(),
      f: Object.fromEntries([['Тренер', CONFIG.TRAINERS[i % CONFIG.TRAINERS.length]], ...toFields(A)])});
  });
  ls.set(K.demo, db);
}

/* ======================= ЗАПУСК ======================= */
async function boot(){
  $('.wrap').classList.remove('wide');
  const p = new URLSearchParams(location.search);
  $('#demo').hidden = true;
  if (DEMO && !p.has('trainer')){
    $('#demo').hidden = false;
    $('#demo').innerHTML = '<b>Демо-режим.</b> Google Таблица не подключена — ответы сохраняются только в этом браузере.';
  }
  if (p.has('trainer') || ss.get(K.trainer, null)){
    T.pwd = ss.get(K.trainer, null);
    if (T.pwd){
      $('#app').innerHTML = '<div class="empty">Загружаем ответы…</div>';
      const r = await loadResults();
      if (r === true) return showTrainer();
      ss.del(K.trainer); return showTrainerLogin(r);
    }
    return showTrainerLogin();
  }
  if (ls.get(K.outbox, []).length) flushOutbox();
  if (S && S.done) return showThanks();
  if (S && S.user) return showSection();
  showLogin(normGroup(p.get('group') || ''));
}
document.addEventListener('DOMContentLoaded', boot);
</script>
